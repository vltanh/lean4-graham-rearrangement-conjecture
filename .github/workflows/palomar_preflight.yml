name: Palomar preflight

# Runs Palomar's complete mechanical verification on this commit, as the registry does
# after a submission, and publishes its report as an artifact. The verifier fetches the
# repository anonymously, so the repository must be public. A run can take hours, so it
# only runs on demand. Keep `pipeline_commit` equal to the commit in `uses`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
